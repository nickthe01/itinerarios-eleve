<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d2d2d" />
  <title>Admin — Itinerários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>
  <div class="brandbar brandbar-admin">
    <div class="brandbar-inner">
      <a class="brand-lockup" href="/" aria-label="Colégio Eleve — início">
        <span class="brand-logo-frame" aria-hidden="true">
          <img class="brand-logo" src="assets/logo-eleve.png" alt="" width="29" height="40" />
        </span>
        <span class="brand-wordmark"><strong>ELEVE</strong><small>COLÉGIO</small></span>
      </a>
      <span class="brand-product">Admin escolar</span>
    </div>
  </div>
  <header class="topbar">
    <h1>Painel Admin — Itinerários</h1>
    <p class="subtitle">Acompanhe as vagas, edite dados e exporte a lista de inscritos.</p>
  </header>

  <main id="conteudo-principal" class="container admin-container">
    <section id="login-box" class="card">
      <h2>Acesso administrativo</h2>
      <form id="form-login-admin" class="form-row">
        <label for="input-token">
          Token de admin
          <input type="password" id="input-token" name="token" placeholder="Cole o token de acesso…" autocomplete="current-password" spellcheck="false" required />
        </label>
        <button id="btn-entrar" type="submit">Entrar</button>
      </form>
      <p id="login-erro" class="hint" role="status" aria-live="polite"></p>
    </section>

    <section id="painel" hidden>
      <div class="admin-toolbar">
        <button id="btn-atualizar" type="button">Atualizar Dados</button>
        <a id="link-export-tudo" class="btn-export" href="#">Exportar CSV (Tudo)</a>
        <p id="admin-status" class="admin-status" role="status" aria-live="polite"></p>
      </div>
      <div id="admin-lista"></div>
    </section>
  </main>

  <template id="template-admin-card">
    <article class="admin-card">
      <div class="admin-card-header">
        <div>
          <span class="dia-tag"></span>
          <h3 class="titulo"></h3>
          <span class="pendente-badge" hidden>PENDENTE — preencher</span>
        </div>
        <span class="badge-vagas"></span>
      </div>
      <p class="professor"></p>
      <div class="admin-actions">
        <button class="btn-toggle-editar" type="button" aria-expanded="false">Editar</button>
        <button class="btn-toggle-alunos" type="button" aria-expanded="false">Ver Alunos</button>
        <a class="btn-export" href="#">Exportar CSV</a>
      </div>

      <form class="form-editar" hidden>
        <label>Título <input name="titulo" type="text" autocomplete="off" /></label>
        <label>Professor(a) <input name="professor" type="text" autocomplete="off" /></label>
        <label>Descrição <textarea name="descricao" rows="4" autocomplete="off"></textarea></label>
        <label>URL do vídeo <input name="video_url" type="url" placeholder="https://…" autocomplete="off" spellcheck="false" /></label>
        <label>Capacidade <input name="capacidade" type="number" min="1" inputmode="numeric" autocomplete="off" /></label>
        <div class="form-editar-botoes">
          <button type="submit">Salvar alterações</button>
          <span class="salvo-msg" role="status" aria-live="polite"></span>
        </div>
      </form>

      <div class="lista-alunos table-scroll" hidden>
        <table>
          <thead>
            <tr><th>#</th><th>Nome</th><th>Turma</th><th>Inscrito em</th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <p class="sem-alunos" hidden>Nenhum aluno inscrito ainda.</p>
      </div>
    </article>
  </template>

  <script src="js/admin.js"></script>
</body>
</html>
