<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Itinerários do Contraturno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header class="topbar">
    <h1>Itinerários do Contraturno</h1>
    <p class="subtitle">Assista à apresentação de cada itinerário e escolha o seu para terça e para quarta-feira.</p>
  </header>

  <main class="container">
    <section id="identificacao" class="card identificacao">
      <h2>Quem é você?</h2>
      <div class="form-row">
        <label>
          Nome completo
          <input type="text" id="input-nome" placeholder="Seu nome completo" autocomplete="name" />
        </label>
        <label>
          Turma / série
          <input type="text" id="input-turma" placeholder="Ex: 9º Ano A" autocomplete="off" />
        </label>
        <button id="btn-salvar-aluno" type="button">Salvar</button>
      </div>
      <p id="status-aluno" class="hint"></p>
    </section>

    <p id="lembrete" class="lembrete" hidden></p>

    <nav class="tabs">
      <button class="tab-btn active" data-dia="terca">Terça-feira</button>
      <button class="tab-btn" data-dia="quarta">Quarta-feira</button>
    </nav>

    <section id="lista-itinerarios" class="grid"></section>
  </main>

  <footer class="footer-coord">
    <button id="btn-abrir-coordenacao" type="button">Área da Coordenação</button>
  </footer>

  <div id="coordenacao-overlay" class="overlay" hidden>
    <div class="modal">
      <button id="btn-fechar-coordenacao" class="btn-fechar-modal" type="button" aria-label="Fechar">×</button>

      <section id="coord-login-box">
        <h2>Acesso da Coordenação</h2>
        <div class="form-row">
          <label>
            Usuário
            <input type="text" id="coord-input-login" autocomplete="username" />
          </label>
          <label>
            Senha
            <input type="password" id="coord-input-senha" autocomplete="current-password" />
          </label>
          <button id="coord-btn-entrar" type="button">Entrar</button>
        </div>
        <p id="coord-login-erro" class="hint"></p>
      </section>

      <section id="coord-painel" hidden>
        <div class="admin-toolbar">
          <button id="coord-btn-atualizar" type="button">Atualizar</button>
          <button id="coord-btn-export-tudo" class="btn-export" type="button">Exportar CSV (tudo)</button>
        </div>
        <div id="coord-relatorio-lista"></div>
      </section>
    </div>
  </div>

  <template id="template-relatorio-card">
    <article class="admin-card">
      <div class="admin-card-header">
        <div>
          <span class="dia-tag"></span>
          <h3 class="titulo"></h3>
        </div>
        <span class="badge-vagas"></span>
      </div>
      <p class="professor"></p>
      <div class="admin-actions">
        <button class="btn-toggle-alunos" type="button">Ver alunos</button>
        <button class="btn-export-item" type="button">Exportar CSV</button>
      </div>

      <div class="lista-alunos" hidden>
        <table>
          <thead>
            <tr><th>#</th><th>Nome</th><th>Turma</th><th>Inscrito em</th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <p class="sem-alunos" hidden>Nenhum aluno inscrito ainda.</p>
      </div>
    </article>
  </template>

  <template id="template-card">
    <article class="itinerario-card">
      <div class="card-header">
        <h3 class="titulo"></h3>
        <span class="badge-vagas"></span>
      </div>
      <p class="professor"></p>
      <div class="video-area"></div>
      <p class="descricao"></p>
      <button class="btn-escolher" type="button">Escolher este itinerário</button>
    </article>
  </template>

  <script src="js/app.js"></script>
  <script src="js/coordenacao-modal.js"></script>
</body>
</html>
