<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coordenação — Itinerários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header class="topbar">
    <h1>Coordenação — Relatório de Itinerários</h1>
    <p class="subtitle">Acompanhe as vagas preenchidas e exporte a lista de inscritos.</p>
  </header>

  <main class="container">
    <section id="login-box" class="card">
      <h2>Acesso da Coordenação</h2>
      <div class="form-row">
        <label>
          Usuário
          <input type="text" id="input-login" autocomplete="username" />
        </label>
        <label>
          Senha
          <input type="password" id="input-senha" autocomplete="current-password" />
        </label>
        <button id="btn-entrar" type="button">Entrar</button>
      </div>
      <p id="login-erro" class="hint"></p>
    </section>

    <section id="painel" hidden>
      <div class="admin-toolbar">
        <button id="btn-atualizar" type="button">Atualizar</button>
        <button id="btn-export-tudo" class="btn-export" type="button">Exportar CSV (tudo)</button>
      </div>
      <div id="relatorio-lista"></div>
    </section>
  </main>

  <template id="template-relatorio-card">
    <article class="admin-card">
      <div class="admin-card-header">
        <div>
          <span class="dia-tag"></span>
          <h3 class="titulo"></h3>
        </div>
        <span class="badge-vagas"></span>
      </div>
      <p class="professor"></p>
      <div class="admin-actions">
        <button class="btn-toggle-alunos" type="button">Ver alunos</button>
        <button class="btn-export-item" type="button">Exportar CSV</button>
      </div>

      <div class="lista-alunos" hidden>
        <table>
          <thead>
            <tr><th>#</th><th>Nome</th><th>Turma</th><th>Inscrito em</th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <p class="sem-alunos" hidden>Nenhum aluno inscrito ainda.</p>
      </div>
    </article>
  </template>

  <script src="js/coordenacao.js"></script>
</body>
</html>
